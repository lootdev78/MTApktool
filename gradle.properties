android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.daemon.idletimeout=10800000
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
kotlin.code.style=official
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

# MTApktool build profile. Override with -Pmtapktool.javaVersion=25.
mtapktool.javaVersion=17

# Shared Android SDK/NDK profile. All Android application/library modules read these
# values so platform updates can be made in one place.
mtapktool.compileSdk=36
mtapktool.minSdk=29
mtapktool.targetSdk=36
mtapktool.ndkVersion=29.0.14033849
