name: Build MTApktool Debug

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14033849"
          yes | sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed | grep -E \
            'platforms;android-36|build-tools;36|ndk;29'

      - name: Verify Gradle daemon uses JDK 17
        run: |
          set -eu
          java_major="$(java -version 2>&1 | sed -n '1s/.*version "\([0-9][0-9]*\).*/\1/p')"
          test "$java_major" = "17" || { echo "Expected JDK 17, got: $java_major"; exit 1; }
          if [ -f gradle/gradle-daemon-jvm.properties ]; then
            grep -qx 'toolchainVersion=17' gradle/gradle-daemon-jvm.properties || {
              echo "gradle/gradle-daemon-jvm.properties must target Java 17"
              cat gradle/gradle-daemon-jvm.properties
              exit 1
            }
          fi

      - name: Verify SDK-36 dependency pins
        run: |
          grep -q 'coreKtx = "1.18.0"' gradle/libs.versions.toml
          grep -q 'lifecycleViewmodelCompose = "2.10.0"' gradle/libs.versions.toml
          grep -q 'version "8.10.1"' build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts

      - name: Verify integrated source modules
        run: |
          set -eu
          for module in \
            app \
            apktool-android \
            apksig-android \
            zipalign-android \
            antlr-runtime \
            smali-android \
            brut.j.common \
            brut.j.util \
            brut.j.dir \
            brut.j.xml \
            brut.j.yaml \
            brut.apktool/apktool-lib \
            brut.apktool/apktool-cli
          do
            test -f "$module/build.gradle.kts" || { echo "Missing module: $module"; exit 1; }
          done
          test -f app/src/main/java/io/github/lootdev78/mtapktool/MainActivity.kt
          test -f apktool-android/src/main/java/io/github/apktool/android/runtime/ApktoolCommandRunner.java
          test -f third_party/antlr-runtime/src/main/java/org/antlr/runtime/Parser.java
          test ! -f third_party/antlr-runtime/src/main/java/org/antlr/runtime/tree/DOTTreeGenerator.java
          grep -q 'api(project(":antlr-runtime"))' smali-android/build.gradle.kts

      - name: Check AAR metadata
        run: ./gradlew :app:checkDebugAarMetadata --stacktrace --no-daemon

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        run: |
          echo "=== APK files ==="
          find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MTApktool-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
