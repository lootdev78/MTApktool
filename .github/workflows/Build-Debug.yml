name: Build MTApktool Debug

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14033849"

          yes | sdkmanager --licenses || true

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed | grep -E \
            'platforms;android-36|build-tools;36|ndk;29'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        run: |
          echo "=== APK files ==="
          find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MTApktool-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
